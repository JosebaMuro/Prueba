# Studio IA Local para Linux / servidor con Docker.
#   docker compose up -d                  -> estudio + Ollama + Qdrant
#   docker compose --profile image up -d  -> además ComfyUI para generar imágenes
# Con GPU NVIDIA instala nvidia-container-toolkit (la sección "deploy" ya la solicita).
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]
    environment:
      OLLAMA_FLASH_ATTENTION: "1"       # menos memoria y más velocidad
      OLLAMA_KV_CACHE_TYPE: q8_0        # caché KV cuantizada: contextos largos con la mitad de VRAM
      OLLAMA_KEEP_ALIVE: 30m            # mantiene los modelos cargados entre mensajes
      OLLAMA_MAX_LOADED_MODELS: "3"     # chat + visión + embeddings a la vez
      OLLAMA_NUM_PARALLEL: "1"          # un usuario: no reservar caché KV para 4 peticiones simultáneas
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    volumes: [qdrant:/qdrant/storage]

  studio:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    depends_on: [ollama, qdrant]
    ports: ["8765:8765"]
    env_file: [{ path: studio.env, required: false }]
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /data/modelos-voz
    volumes:
      - ./data:/data
      - ./workspace:/workspace
      - ./voices:/voices

  comfyui:
    profiles: [image]
    image: yanwk/comfyui-boot:cu124-slim
    restart: unless-stopped
    volumes: [comfyui:/root]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes: { ollama: {}, qdrant: {}, comfyui: {} }
