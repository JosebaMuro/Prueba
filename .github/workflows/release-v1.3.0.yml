# Temporal: publica la Release v1.3.0 con los binarios de .release/ (se borra después)
name: Publicar Release v1.3.0
on:
  push:
    branches: [claude/project-thread-m0y6uk]
    paths: ['.release/**']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unir y comprobar archivos
        run: |
          cd .release
          cat StudioIA-Android-Snapdragon.apk.part* > StudioIA-Android-Snapdragon.apk
          cat StudioIA-Windows-x64.zip.part* > StudioIA-Windows-x64.zip
          sha256sum -c SHA256SUMS.txt
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd .release
          gh release create v1.3.0 --repo "$GITHUB_REPOSITORY" --target main \
            --title "Studio IA Local 1.3.0" --notes-file v1.3.0-notas.md --latest \
            StudioIA-Windows-x64.zip StudioIA-Android-Snapdragon.apk StudioIA-Android.apk SHA256SUMS.txt
